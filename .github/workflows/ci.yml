name: CI checks

on:
  pull_request:
  push:
    branches: main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test-msrv:
    name: Test MSRV on ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        name: [linux, linux-aarch64, windows, macos]
        include:
          - name: linux
            os: ubuntu-latest
            build_deps: >
              libpcsclite-dev

          - name: linux-aarch64
            os: ubuntu-24.04-arm
            build_deps: >
              libpcsclite-dev

          - name: windows
            os: windows-latest

          - name: macos
            os: macos-latest

    steps:
      - uses: actions/checkout@v5
      - name: Install build dependencies
        run: sudo apt install ${{ matrix.build_deps }}
        if: matrix.build_deps != ''
      - uses: dtolnay/rust-toolchain@stable
        id: stable-toolchain
      - uses: Swatinem/rust-cache@v2
      - name: Install test dependencies using latest stable Rust
        run: cargo +${{steps.stable-toolchain.outputs.name}} install rage
      - name: Run tests
        run: cargo test
      - name: Verify working directory is clean
        run: git diff --exit-code

  test-latest:
    name: Test latest stable on ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        name: [linux, linux-aarch64, windows, macos]
        include:
          - name: linux
            os: ubuntu-latest
            build_deps: >
              libpcsclite-dev

          - name: linux-aarch64
            os: ubuntu-24.04-arm
            build_deps: >
              libpcsclite-dev

          - name: windows
            os: windows-latest

          - name: macos
            os: macos-latest

    steps:
      - uses: actions/checkout@v5
      - name: Install build dependencies
        run: sudo apt install ${{ matrix.build_deps }}
        if: matrix.build_deps != ''
      - uses: dtolnay/rust-toolchain@stable
        id: toolchain
      - run: rustup override set ${{steps.toolchain.outputs.name}}
      - uses: Swatinem/rust-cache@v2
      - name: Install test dependencies
        run: cargo install rage
      - name: Remove lockfile to build with latest dependencies
        run: rm Cargo.lock
      - name: Run tests
        run: cargo test
      - name: Verify working directory is clean (excluding lockfile)
        run: git diff --exit-code ':!Cargo.lock'

  codecov:
    name: Code coverage
    runs-on: ubuntu-latest
    container:
      image: xd009642/tarpaulin:develop-nightly
      options: --security-opt seccomp=unconfined

    steps:
      - uses: actions/checkout@v5
      - name: Install build dependencies
        run: apt update && apt install -y libpcsclite-dev
      - name: Generate coverage report
        run: >
          cargo tarpaulin
          --engine llvm
          --timeout 180
          --out xml
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          fail_ci_if_error: true
          token: ${{ secrets.CODECOV_TOKEN }}

  doc-links:
    name: Intra-doc links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install build dependencies
        run: sudo apt install libpcsclite-dev
      - uses: Swatinem/rust-cache@v2
      - run: cargo fetch
      # Requires #![deny(rustdoc::broken_intra_doc_links)] in crates.
      - name: Check intra-doc links
        run: cargo doc --document-private-items

  fmt:
    name: Rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Check formatting
        run: cargo fmt -- --check